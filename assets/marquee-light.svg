  <text x="132" y="86" fill="#1c2430" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="0.5">Mahmoud Nabil</text>
  <text x="132" y="112" fill="#526074" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">software engineer  ·  egypt</text>
