      <text x="1348" y="155" fill="#526074" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">BUILDING MOBILE + BACKEND APPS    ·    REACT NATIVE    ·    NESTJS    ·    SWIFT    ·    AWS    ·    SALESFORCE    ·    SIDE QUESTS: ANIME, MANGA, AND WEIRD LITTLE PROJECTS    ·    </text>
