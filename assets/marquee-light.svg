<svg xmlns="http://www.w3.org/2000/svg" width="900" height="168" viewBox="0 0 900 168" role="img" aria-labelledby="title">
  <title id="title">Mahmoud Nabil, software engineer. Player one, ready.</title>

  <rect width="900" height="168" fill="#fbf6ec"/>
