<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img">
  <title>A mushroom-headed fighter throws a ball through three rooms, then the tools roll by.</title>
  <rect width="900" height="620" fill="#fbf6ec"/>
  <circle cx="40" cy="28" r="1.1" fill="#1d6fbf" opacity="0.7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="200" cy="50" r="1.1" fill="#1d6fbf" opacity="0.7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.05s" repeatCount="indefinite"/></circle><circle cx="480" cy="22" r="1.1" fill="#1d6fbf" opacity="0.7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.3s" repeatCount="indefinite"/></circle><circle cx="700" cy="36" r="1.1" fill="#1d6fbf" opacity="0.7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.55s" repeatCount="indefinite"/></circle><circle cx="840" cy="18" r="1.1" fill="#1d6fbf" opacity="0.7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="120" cy="300" r="1.1" fill="#1d6fbf" opacity="0.7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.05s" repeatCount="indefinite"/></circle><circle cx="620" cy="360" r="1.1" fill="#1d6fbf" opacity="0.7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.3s" repeatCount="indefinite"/></circle>
  <line x1="560" y1="0" x2="560" y2="360" stroke="#e4d8c4"/>
  <line x1="0" y1="360" x2="900" y2="360" stroke="#e4d8c4"/>
  <line x1="300" y1="360" x2="300" y2="520" stroke="#e4d8c4"/>
  <line x1="0" y1="520" x2="900" y2="520" stroke="#e4d8c4"/>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="70,70;70,52;70,70;70,70"
      keyTimes="0;0.22;0.32;1" dur="20s" repeatCount="indefinite"/>
    <g transform="scale(2.15)">
    <g id="fighter">
      <ellipse cx="36" cy="98" rx="18" ry="4" fill="#1a1020" opacity="0.12"/>
      <rect x="22" y="6" width="36" height="18" rx="8" fill="#e10600"/>
      <rect x="16" y="18" width="48" height="10" rx="4" fill="#b00000"/>
      <rect x="28" y="8" width="9" height="7" rx="2" fill="#fffdf8"/>
      <rect x="42" y="10" width="6" height="5" rx="2" fill="#fffdf8"/>
      <rect x="28" y="28" width="24" height="12" rx="4" fill="#e2b48a"/>
      <rect x="33" y="32" width="4" height="4" fill="#1a1020"/>
      <rect x="43" y="32" width="4" height="4" fill="#1a1020"/>
      <rect x="22" y="40" width="32" height="28" rx="5" fill="#0e8f78"/>
      <rect x="32" y="46" width="12" height="12" rx="2" fill="#0a5c4e"/>
